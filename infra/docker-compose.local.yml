services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: braincrew
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: braincrew-local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d braincrew"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - braincrew-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - braincrew-redis:/data

volumes:
  braincrew-postgres:
  braincrew-redis:
